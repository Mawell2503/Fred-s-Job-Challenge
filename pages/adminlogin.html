<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdminLogin</title>
</head>

<body>
    <form id="auth">
        <label for="user">Username</label>
        <input id="user" name="user" type="text" autocomplete="username" required>

        <label for="pass">Password</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" required>

        <button type="submit" value="login">Log in</button>
        <button type="submit" value="signup">Sign up</button>

        <p id="msg" role="alert"></p>
    </form>

    <script>
        const form = document.getElementById('auth');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const action = e.submitter.value; // "login" or "signup"
            msg.textContent = '';
            try {
                const res = await fetch(`/api/admin/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: form.user.value.trim(), password: form.pass.value })
                });
                if (!res.ok) throw new Error(`${action} failed (${res.status})`);
                msg.textContent = action === 'login' ? 'Logged in.' : 'Account created.';
            } catch (err) {
                msg.textContent = err.message;
            }
        });
    </script>
</body>

</html>
