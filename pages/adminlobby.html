<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shader progress bar</title>

    <!-- the component's styles -->
    <link rel="stylesheet" href="../styles.css">

    <style>
        /* demo page only (not part of the component) */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: #f1f1f4;
            background-image: radial-gradient(#d9d9df 1px, transparent 1px);
            background-size: 18px 18px;
            font-family: Inter, Geist, "SF Pro Display", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .stage {
            width: min(680px, 100%);
        }

        .controls {
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #55555e;
        }

        .controls input[type=range] {
            flex: 1;
            accent-color: #5aa51f;
        }

        .controls button {
            font: inherit;
            padding: 6px 12px;
            border: 1px solid #d5d5dc;
            border-radius: 999px;
            background: #fff;
            color: #333;
            cursor: pointer;
        }

        .controls button:hover {
            background: #f6f6f9;
        }
    </style>
</head>

<body>
    <div class="stage">

        <!-- THE COMPONENT MARKUP: copy this block where you want the bar -->
        <div class="progress" id="progress" role="progressbar" aria-label="Syncing library" aria-valuemin="0"
            aria-valuemax="100" aria-valuenow="0">
            <canvas class="progress__fx"></canvas>
            <div class="progress__text">
                <h2 class="progress__title">Syncing library</h2>
                <p class="progress__sub">Preparing your files</p>
            </div>
            <div class="progress__value"><span class="progress__pct">0</span>%</div>
        </div>

        <!-- demo controls -->
        <div class="controls">
            <button id="replay" type="button">Replay</button>
            <input id="slider" type="range" min="0" max="100" step="0.1" value="0" aria-label="Set progress">
            <button id="auto" type="button">Auto: on</button>
        </div>
    </div>

    <!-- the component's logic (defines window.ShaderProgress) -->
    <script src="progress-bar.js"></script>

    <script>
        /* demo wiring only */
        const bar = new ShaderProgress(document.getElementById('progress'));
        const slider = document.getElementById('slider');
        const autoBtn = document.getElementById('auto');
        const replay = document.getElementById('replay');

        let auto = true, runStart = performance.now();
        const DURATION = 9000;                      // ms for a full 0 -> 100 run

        function loop(now) {
            if (auto) {
                const k = ((now - runStart) % (DURATION + 1500)) / DURATION;   // short pause at 100%
                const v = Math.min(1, k);
                bar.setProgress(v);
                slider.value = v * 100;
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        slider.addEventListener('input', () => {
            auto = false; autoBtn.textContent = 'Auto: off';
            bar.setProgress(slider.value / 100);
        });
        autoBtn.addEventListener('click', () => {
            auto = !auto; autoBtn.textContent = 'Auto: ' + (auto ? 'on' : 'off');
            if (auto) runStart = performance.now();
        });
        replay.addEventListener('click', () => {
            bar.jump(0); auto = true; autoBtn.textContent = 'Auto: on'; runStart = performance.now();
        });

        window.bar = bar;   // console testing: bar.setProgress(0.42)
    </script>
</body>

</html>
