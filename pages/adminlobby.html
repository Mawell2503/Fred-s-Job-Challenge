<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Lobby</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 40rem;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }

        .logout {
            font: inherit;
            padding: 0.6rem 1.2rem;
            border: 1px solid #d5d5dc;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>ADMINLOBBY</h1>
    <p id="who"></p>
    <nav>
        <a class="button" href="roles.html">Open the hiring pipeline &rarr;</a>
        <button type="button" class="logout" id="logout">Log out</button>
    </nav>
    <p>Create a role, let Clara propose the criteria and check them, set the practical requirements, then press <b>Run full pipeline</b>: Oscar, Remi, Jules, the committee (Hélène, Victor, Nina) and Gaston's report.</p>

    <script>
        fetch('/api/admin/me')
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d) document.getElementById('who').textContent = `Logged in as ${d.user}.`; });

        document.getElementById('logout').addEventListener('click', async () => {
            await fetch('/api/admin/logout', { method: 'POST' });
            location.href = '/';
        });
    </script>
</body>

</html>
