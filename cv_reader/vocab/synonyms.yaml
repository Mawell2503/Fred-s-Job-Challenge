# Vocabulary standardisation (Oscar).
#
# Each entry:   Canonical name: [other ways people write it]
# Matching ignores case, accents and punctuation, so "ReactJS", "react.js" and
# "React JS" all become the same skill. The canonical name is also matched itself,
# so you never need to repeat it in the list.
#
# The SAME dictionary is used for CVs (Oscar) and for job criteria (Clara/Remi),
# which is what makes "dev front" on a CV match "React" in a job description only
# if you decide they mean the same thing here. Edit freely; add your own domains.

